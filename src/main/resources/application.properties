spring.application.name=skillhubapi

# SpringDoc configuration
springdoc.api-docs.enabled=true
springdoc.data-rest.enabled=false  # CRÍTICO: desabilita processamento do Spring Data REST
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Se quiser excluir endpoints específicos
springdoc.paths-to-exclude=/api/rest/**,/actuator/**

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/loja_virtual
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto PostgreSql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring Data REST (se mantiver a dependência)
spring.data.rest.detection-strategy=annotated
# Só expõe repositórios anotados
spring.data.rest.base-path=/api/rest

security.jwt.secret=MY_ENTERPRISE_SECRET_KEY_123456789
security.jwt.expiration-minutes=15
security.jwt.refresh-expiration-minutes=60