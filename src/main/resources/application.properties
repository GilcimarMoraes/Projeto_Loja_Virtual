# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/loja_virtual
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger SIMPLES
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

spring.data.rest.detection-strategy=annotated
spring.data.rest.base-path=/api/rest

# JWT Configuration (ADICIONE ESTAS)
security.jwt.secret=MY_SUPER_SECRET_KEY_1234567890_ABCDEFGHIJKLMNOPQRSTUVWXYZ
security.jwt.expiration-minutes=60
security.jwt.refresh-expiration-minutes=1440